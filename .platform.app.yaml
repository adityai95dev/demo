name: app
type: php:8.2
build:
  flavor: composer

web:
  locations:
    "/":
      root: "public"
      index: ["index.php"]
      passthru: "/index.php"

mounts:
  "/var": "shared:files/var"
  "/public/var": "shared:files/public-var"
  "/public/static": "shared:files/public-static"

disk: 2048

variables:
  env:
    APP_ENV: "prod"
    PIMCORE_INSTALL_ADMIN_USER: "admin"
    PIMCORE_INSTALL_ADMIN_PASSWORD: "admin"
    DATABASE_URL: "mysql://fake:fake@127.0.0.1:3306/fakedb" # Dummy DB URL to bypass connection

hooks:
  build: |
    set -e
    echo "Installing dependencies without triggering DB or Redis setup..."
    composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

  deploy: |
    set -e
    echo "Clearing Symfony/Pimcore cache..."
    php bin/console cache:clear || true
    echo "Skipping Pimcore DB & Redis installation (no services configured)."
