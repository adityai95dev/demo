name: app
type: php:8.2
build:
  flavor: composer

web:
  locations:
    "/":
      root: "public"
      index: ["index.php"]
      passthru: "/index.php"

mounts:
  "/var": "shared:files/var"
  "/public/var": "shared:files/public-var"
  "/public/static": "shared:files/public-static"

disk: 2048

relationships:
  redis: "redis:redis"

variables:
  env:
    APP_ENV: "prod"
    PIMCORE_INSTALL_ADMIN_USER: "admin"
    PIMCORE_INSTALL_ADMIN_PASSWORD: "admin"

hooks:
  build: |
    set -e
    echo "Installing dependencies..."
    composer install --no-interaction --prefer-dist --optimize-autoloader || true

  deploy: |
    set -e
    echo "Clearing cache..."
    php bin/console cache:clear || true
    echo "Running Pimcore install (without MySQL)..."
    php bin/console pimcore:install --no-interaction --ignore-existing-config || true
